name: Join the bot network
description: Introduce your bot in the bot network (bots of this add-on that share what their radio hears over the internet)
title: "Bot network: <your bot name>"
labels: ["bot-network"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for joining! Switching on the **BotNetwork** card is all it takes to be in the network (see the
        **Bot network** part of the add-on's Documentation tab). Introducing your bot here lets other owners put it on
        their *Trusted bots* list, so the channel and bot names it shares are used at once.
  - type: input
    id: bot_name
    attributes:
      label: Name of your bot
      description: Exactly as it shows on the mesh, for example "Town|🤖".
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region
      description: Where the bot is, for example NL-LI, BE-VLG or DE-NW. The same code you put on the BotNetwork card.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Add-on version
      description: Settings > Add-ons > MeshCore Bot, for example 1.1.0.
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio settings
      description: Frequency / SF / BW, for example 869.618 / 8 / 62.5.
  - type: input
    id: bot_id
    attributes:
      label: Bot id (optional)
      description: The 12 characters shown for your bot on another bot's Bots page, if you know it.
